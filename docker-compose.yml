version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: energy-agent-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LLM_PROVIDER=mock
      - MOCK_LLM=true
      - DB_PATH=/app/data/energy.duckdb
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: energy-agent-ui
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_HOST=api
      - API_PORT=8000
      - API_BASE_URL=http://api:8000
      - DB_PATH=/app/data/energy.duckdb
    volumes:
      - ./data:/app/data
    depends_on:
      - api
